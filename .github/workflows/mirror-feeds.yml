name: Mirror calendar feeds

# People subscribed to webcal://byronfor25.com/events/all.ics before the move
# to sigchofor25.com. Calendar apps do not follow a page redirect, so this
# keeps a fresh copy of both feeds at the old address.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds from the main site
        run: |
          mkdir -p events
          for f in all.ics all-es.ics; do
            curl -fsSL "https://sigchofor25.com/events/$f" -o "events/$f.new"
            grep -q "BEGIN:VCALENDAR" "events/$f.new"
            mv "events/$f.new" "events/$f"
          done
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain events)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events
            git commit -m "Mirror calendar feeds from sigchofor25.com"
            git push
          fi
